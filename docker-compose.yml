services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=development
      - JWT_SECRET=CoD3r0$-AP1-G4t3w4y
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_QUEUE=users_queue
      - COURSES_QUEUE=courses_queue
      - PAYMENTS_QUEUE=payment_queue
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-ms:
        condition: service_started
      courses-ms:
        condition: service_started

  users-ms:
    container_name: users-ms
    build:
      context: ./users-ms
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=users_db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=users_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_QUEUE=users_queue
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      users_db:
        condition: service_healthy
    restart: unless-stopped  # Importante: reiniciar si falla
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  users_db:
    container_name: users_db
    image: postgres:15.3-alpine
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users_db
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  courses-ms:
    container_name: courses-ms
    build:
      context: ./courses-ms
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_HOST=courses_db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=courses_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_QUEUE=courses_queue
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      courses_db:
        condition: service_healthy
    restart: unless-stopped  # Importante: reiniciar si falla
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  courses_db:
    container_name: courses_db
    image: postgres:15.3-alpine
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=courses_db
    volumes:
      - courses_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  users_postgres_data:
  courses_postgres_data: