version: '3'

services:
  courses_db:
    image: postgres:latest
    environment:
      POSTGRES_DB: courses_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - courses_network

  courses_ms:
    build: .
    depends_on:
      - courses_db
    environment:
      DB_HOST: courses_db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: courses_db
    ports:
      - "3001:3001"
    networks:
      - courses_network

networks:
  courses_network: